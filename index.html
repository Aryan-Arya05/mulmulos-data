<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MulmulOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070d1a; --deep:#04070f; --surface:#0c1526; --surfaceHi:#111c31;
  --border:#1c2a44; --borderHi:#27395a;
  --text:#e8eefc; --muted:#94a6c4; --dim:#5b6f92;
  --cyan:#38bdf8; --cyanDeep:#0ea5e9; --violet:#a78bfa;
  --ok:#34d399; --warn:#fbbf24; --err:#fb7185;
  --sans:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--deep);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
.shell{display:flex;min-height:100vh}
aside{width:210px;flex-shrink:0;background:var(--deep);border-right:1px solid var(--border);padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 18px 22px}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),#8b5cf6);display:grid;place-items:center;font-weight:700;color:#04131f;box-shadow:0 0 20px #38bdf855}
.brand h1{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand h1 span{color:var(--cyan)}
.brand p{font-size:11px;color:var(--dim);margin-top:2px}
.navlbl{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:0 18px 9px}
nav a{display:flex;align-items:center;gap:10px;margin:0 10px 3px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;border:1px solid transparent;cursor:pointer}
nav a.on{color:var(--text);font-weight:600;background:linear-gradient(135deg,#38bdf822,#a78bfa14);border-color:#38bdf844}
nav a .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);margin-left:auto}
main{flex:1;min-width:0;background:var(--bg)}
.top{position:sticky;top:0;z-index:5;padding:16px 26px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#070d1af2;backdrop-filter:blur(8px)}
.top .crumb{font-size:11px;color:var(--dim)}
.top h2{font-size:19px;font-weight:600;letter-spacing:-.015em;text-transform:capitalize}
.chip{margin-left:auto;display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:11.5px;color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block}
.chip.stale i{background:var(--warn)}
.wrap{padding:24px 26px 60px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{background:linear-gradient(160deg,var(--surfaceHi),var(--surface));border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,#38bdf818,transparent 62%);pointer-events:none}
.kpi h3{font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:9px}
.kpi .v{font-family:var(--mono);font-size:26px;letter-spacing:-.02em;line-height:1}
.kpi .s{font-size:11px;color:var(--dim);margin-top:9px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-top:18px}
.card h3{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3 em{font-style:normal;font-size:11px;color:var(--dim);font-weight:400}
table{width:100%;border-collapse:collapse}
th{text-align:right;font-size:11px;color:var(--dim);font-weight:600;padding:11px 14px;background:var(--surfaceHi);border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted);padding:10px 14px;border-bottom:1px solid #1c2a4466;white-space:nowrap}
td:first-child{font-family:var(--sans);font-size:12.5px;color:var(--text);white-space:normal}
tbody tr:nth-child(odd){background:#111c3155}
.tblwrap{border:1px solid var(--border);border-radius:10px;overflow:hidden;overflow-x:auto}
.bar{height:6px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.note{margin-top:14px;padding:10px 12px;border-left:2px solid var(--warn);background:var(--surfaceHi);font-size:11.5px;line-height:1.6;color:var(--muted);border-radius:0 8px 8px 0}
.note.err{border-color:var(--err)}
.note.ok{border-color:var(--ok)}
.pill{display:inline-block;font-family:var(--sans);font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted);margin-left:6px}
.hide{display:none}
.segs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seglbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-right:2px}
.seg{padding:6px 12px;border-radius:8px;border:1px solid var(--border);color:var(--muted);font-size:12px;cursor:pointer;user-select:none}
.seg.on{background:linear-gradient(135deg,var(--cyan),var(--cyanDeep));color:#04131f;font-weight:600;border-color:transparent}
.dateinput{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:12.5px;padding:6px 10px;outline:none;color-scheme:dark}
.dateinput:focus{border-color:var(--cyan)}
.empty{color:var(--dim);font-size:12px;line-height:1.7;padding:10px 0}
@media(max-width:820px){aside{display:none}.wrap,.top{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">
      <div class="mark">M</div>
      <div><h1>Mulmul<span>OS</span></h1><p>Operator console</p></div>
    </div>
    <div class="navlbl">Revenue</div>
    <nav id="nav1">
      <a data-v="overview" class="on">Overview</a>
      <a data-v="channels">Channels</a>
      <a data-v="stylists">Stylists</a>
      <a data-v="stores">Stores</a>
      <a data-v="products">Products</a>
      <a data-v="history">Retail history</a>
    </nav>
    <div class="navlbl" style="margin-top:18px">Paid</div>
    <nav id="nav2">
      <a data-v="google">Google Ads</a>
      <a data-v="meta">Meta Ads</a>
    </nav>
    <div class="navlbl" style="margin-top:18px">Behaviour</div>
    <nav id="nav4"><a data-v="funnels">Funnels</a></nav>
    <div class="navlbl" style="margin-top:18px">System</div>
    <nav id="nav3">
      <a data-v="quality">Data quality</a>
    </nav>
  </aside>

  <main>
    <div class="top">
      <div><div class="crumb">Shop Mulmul</div><h2 id="title">Overview</h2></div>
      <div class="chip" id="fresh"><i></i><span>loading…</span></div>
      <span id="syncnote" style="display:none;font-size:11.5px;color:var(--muted);padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface)"></span>
      <a class="seg" id="sync">Sync</a>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<script>
/* ── Sync configuration ────────────────────────────────────────────
   The Sync button calls GitHub directly, so this token is visible to
   anyone who can open this page. That is a deliberate trade for a
   three-person team, and it is bounded on purpose:

     · Fine-grained token, THIS REPO ONLY, Actions: Read and write.
       Nothing else — it cannot read code or reach Shopify/Meta/Google.
     · Set a 90-day expiry when you create it, so a stray copy dies.
     · Worst case if it leaks: someone triggers data pulls.

   Note the dashboard itself exposes more than the token does — revenue,
   stylist names, store staff. Treat the URL as the sensitive thing.

   Create at: GitHub → Settings → Developer settings →
              Fine-grained tokens → Repository access: mulmulos-data →
              Permissions → Actions: Read and write
   ────────────────────────────────────────────────────────────────── */
const SYNC_TOKEN = "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";                       // github_pat_…
const SYNC_REPO  = "Aryan-Arya05/mulmulos-data";
const SYNC_DAYS  = 3;                        // window a click re-pulls

const $ = (s,r=document)=>r.querySelector(s);
const inr = n => n==null||isNaN(n) ? "—" : "₹"+Math.round(n).toLocaleString("en-IN");
const lakh = n => n==null||isNaN(n) ? "—" : "₹"+(n/100000).toFixed(2)+"L";
const num = n => n==null||isNaN(n) ? "—" : Number(n).toLocaleString("en-IN");
const pct = n => n==null||isNaN(n) ? "—" : Math.round(n*100)+"%";
/* Conversion and funnel rates run well under 1%. Rounding those to a
   whole number turned 0.15% into "0%", so small values keep decimals. */
const rate = n => n==null||isNaN(n) ? "—"
  : n < 0.01 ? (100*n).toFixed(2)+"%"
  : n < 0.1  ? (100*n).toFixed(2)+"%"
  : (100*n).toFixed(1)+"%";
const xx  = n => n==null||isNaN(n) ? "—" : Number(n).toFixed(2)+"x";
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function ago(iso){
  if(!iso) return "never";
  const s=Math.floor((Date.now()-new Date(iso))/1000);
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}

const state = { shopify:null, google:null, eretail:null, meta:null, ga4app:null, ga4web:null, view:"overview", errors:[],
  range:"ytd", cmp:"prev_year", channel:"all",
  pBucket:"all", pCat:"all", pDays:"all", pSort:"units", gType:"all", win:"all", from:null, to:null };

async function load(name){
  try{
    const r = await fetch(`./data/${name}.json?t=`+Date.now());
    if(!r.ok) throw new Error(r.status+" "+r.statusText);
    return await r.json();
  }catch(e){ state.errors.push(`${name}.json — ${e.message}`); return null; }
}

function table(cols, rows, empty){
  if(!rows||!rows.length) return `<div class="empty">${empty||"Nothing to show."}</div>`;
  return `<div class="tblwrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const kpi = (h,v,s,colour) => `<div class="kpi"><h3>${esc(h)}</h3><div class="v"${colour?` style="color:${colour}"`:""}>${v}</div>${s?`<div class="s">${s}</div>`:""}</div>`;

/* ---------- views ---------- */
const views = {
overview(){
  const s = state.shopify, g = state.google;
  if(!s) return missing("shopify");
  const t = s.totals;
  const gp = g?.accounts?.find(a=>a.id==="3669746941");
  const gSpend = gp?.totals?.webSpend || 0;
  const mSpend = state.meta?.totals?.spend || 0;
  const adSpend = gSpend + mSpend;
  const mer = adSpend ? t.digitalRevenue/adSpend : null;
  return `
  <div class="grid">
    ${kpi("Total revenue", lakh(t.revenue), `${num(t.orders)} orders · ${s.range}`)}
    ${kpi("Digital", lakh(t.digitalRevenue), pct(t.digitalShare)+" of revenue", "var(--cyan)")}
    ${kpi("People-led", lakh(t.revenue-t.digitalRevenue), "stylist + retail assist", "var(--violet)")}
    ${kpi("New customers", num(t.newCustomers), pct(t.newCustomerShare)+" of buyers", "var(--ok)")}
    ${kpi("Re-books", num(t.rebookOrders), inr(t.rebookValue)+" labelled", t.rebookOrders?"var(--warn)":null)}
    ${kpi("Gifted away", lakh(t.giftValueWaived), "waived on "+num(s.buckets.find(b=>b.bucket==="gift")?.orders||0)+" gift orders","var(--warn)")}
  </div>
  <div class="card">
    <h3>Where revenue comes from<em>${esc(s.range||"")}</em></h3>
    ${bucketRows(s)}
    <div class="note">Retail proper is not in Shopify — it lives in eRetail. <b>retail_assist</b> is only the endless-aisle slice booked by store staff for out-of-stock items.</div>
  </div>
  ${adSpend?`<div class="card"><h3>Blended efficiency<em>digital revenue ÷ paid spend</em></h3>
    <div class="grid">
      ${kpi("Digital revenue", lakh(t.digitalRevenue),"online + app")}
      ${kpi("Meta spend", lakh(mSpend), mSpend?"store-visit excluded":"not pulled yet")}
      ${kpi("Google web spend", lakh(gSpend),"OMNI excluded")}
      ${kpi("MER", xx(mer), mSpend?"both platforms":"Google only — understated","var(--ok)")}
    </div>
    <div class="note">${mSpend?"Both platforms included. Windows may differ slightly between sources — check Data quality.":"Meta spend is missing, so this MER is overstated."} An efficiency ratio never proves incrementality.</div>
  </div>`:""}`;
},

channels(){
  const s = state.shopify; if(!s) return missing("shopify");
  const grain = s.bucketDaily||[];
  const w = grain.length ? windowFrom(grain.map(g=>g.date)) : null;

  let buckets = s.buckets||[], tot = s.totals?.revenue||0, newC = s.totals?.newCustomers, retC = s.totals?.returningCustomers;
  if(w){
    const m = new Map();
    let nc=0, rc=0;
    for(const g of grain){
      if(g.date < w.from || g.date > w.to) continue;
      const o = m.get(g.bucket) || {bucket:g.bucket, revenue:0, orders:0};
      o.revenue += g.revenue; o.orders += g.orders;
      nc += g.newCustomers||0; rc += g.returningCustomers||0;
      m.set(g.bucket,o);
    }
    const rows=[...m.values()];
    tot = rows.reduce((a,b)=>a+b.revenue,0);
    buckets = rows.map(b=>({...b, share: tot?b.revenue/tot:0, aov: b.orders?b.revenue/b.orders:null}))
      .sort((a,b)=>b.revenue-a.revenue);
    newC=nc; retC=rc;
  }

  const colour = b => b.startsWith("online")||b==="app" ? "var(--cyan)"
    : b==="stylist"||b==="retail_assist" ? "var(--violet)"
    : b==="gift" ? "var(--warn)" : b.includes("_to_draft")||b==="draft_unclassified" ? "var(--warn)" : "var(--muted)";

  return `${coverageWarning(s, w)}${w?windowBar(w):`<div class="card" style="margin-top:0"><div class="note">This shopify.json predates daily channel rows. Re-run <b>Pull Shopify</b> for date filtering.</div></div>`}
  <div class="grid">
    ${kpi("Revenue", lakh(tot), w?`${esc(w.from)} → ${esc(w.to)}`:esc(s.range||""))}
    ${kpi("Orders", num(buckets.reduce((a,b)=>a+b.orders,0)), "in range")}
    ${kpi("New customers", num(newC), (newC+retC)?pct(newC/(newC+retC))+" of buyers":"", "var(--ok)")}
  </div>
  <div class="card"><h3>Every channel<em>${w?`${w.days} day${w.days===1?"":"s"}`:esc(s.range||"")}</em></h3>
  ${table(["Bucket","Revenue","Orders","AOV","Share"], buckets.map(b=>[
    `<span style="color:${colour(b.bucket)}">${esc(b.bucket)}</span>`,
    inr(b.revenue), num(b.orders), inr(b.aov),
    `${pct(b.share)}<div class="bar"><i style="width:${100*b.share}%"></i></div>`
  ]), "No orders in this range.")}</div>
  <div class="card"><h3>What each bucket means</h3>
  ${table(["Bucket","Meaning"],[
    ["online","Web checkout"],["app","Appbrew mobile app"],
    ["stylist","Backend sale, stylist named on the order timeline"],
    ["retail_assist","Store staff booking an item not in stock — note reads REC AT &lt;store&gt;"],
    ["gift","Influencer or celebrity seeding — customer name has GIFT, or a discount titled gift"],
    ["online_to_draft","A web order was cancelled and re-created as a draft"],
    ["app_to_draft","An app order was cancelled and re-created as a draft"],
    ["other_to_draft","Re-book whose original came from some other source"],
    ["draft_unclassified","Matched no rule — surfaced, never guessed"],
  ])}
  <div class="note">Re-books are labelled, never subtracted, so these totals still reconcile against Shopify's own reports.</div>
  ${s.includesToday?`<div class="note ok">Today is included. Shopify orders are real-time, so today's revenue and order count are accurate as of the last sync — unlike ad ROAS, which lags.</div>`:""}
  ${s.stylistAttribution==="skipped on this run"?`<div class="note">This was a fast refresh, so stylist attribution was skipped — those orders sit in <b>draft_unclassified</b> until the next full pull.</div>`:""}</div>`;
},

stylists(){
  const s = state.shopify; if(!s) return missing("shopify");
  const grain = s.stylistDaily||[];
  const w = grain.length ? windowFrom(grain.map(g=>g.date)) : null;

  let rows = s.stylists||[];
  if(w){
    const m = new Map();
    for(const g of grain){
      if(g.date < w.from || g.date > w.to) continue;
      const o = m.get(g.stylist) || {stylist:g.stylist, revenue:0, orders:0};
      o.revenue += g.revenue; o.orders += g.orders;
      m.set(g.stylist,o);
    }
    rows = [...m.values()].sort((a,b)=>b.revenue-a.revenue);
  }
  const tot = rows.reduce((a,r)=>a+r.revenue,0);

  return `${coverageWarning(s, w)}${w?windowBar(w):`<div class="card" style="margin-top:0"><div class="note">This shopify.json predates daily stylist rows. Re-run <b>Pull Shopify</b> for date filtering.</div></div>`}
  <div class="grid">
    ${kpi("Stylist revenue", lakh(tot), `${rows.length} stylists`, "var(--violet)")}
    ${kpi("Orders", num(rows.reduce((a,r)=>a+r.orders,0)), w?`${w.days} day${w.days===1?"":"s"}`:"")}
    ${kpi("Top stylist", esc(rows[0]?.stylist||"—"), inr(rows[0]?.revenue))}
  </div>
  <div class="card"><h3>Stylists by revenue<em>from the order timeline</em></h3>
  ${table(["Stylist","Revenue","Orders","AOV","Share"], rows.map(r=>[
    esc(r.stylist), inr(r.revenue), num(r.orders), inr(r.revenue/r.orders),
    `${pct(tot?r.revenue/tot:0)}<div class="bar"><i style="width:${tot?100*r.revenue/tot:0}%"></i></div>`
  ]), "No stylist orders in this range.")}
  <div class="note">Attribution comes from a comment posted on each order seconds after creation. A mistyped or missing comment lands the order in <b>draft_unclassified</b> rather than being assigned to anyone.</div></div>`;
},

stores(){
  const s = state.shopify; if(!s) return missing("shopify");
  const grain = s.storeDaily||[];
  const w = grain.length ? windowFrom(grain.map(g=>g.date)) : null;

  let rows = s.stores||[];
  if(w){
    const m = new Map();
    for(const g of grain){
      if(g.date < w.from || g.date > w.to) continue;
      const o = m.get(g.store) || {store:g.store, revenue:0, orders:0};
      o.revenue += g.revenue; o.orders += g.orders;
      m.set(g.store,o);
    }
    /* Carry the merge provenance across from the full-window list. */
    const meta = new Map((s.stores||[]).map(x=>[x.store,x]));
    rows = [...m.values()].map(x=>({...x, merged:meta.get(x.store)?.merged, variants:meta.get(x.store)?.variants||[], matched:meta.get(x.store)?.matched}))
      .sort((a,b)=>b.revenue-a.revenue);
  }
  const tot = rows.reduce((a,r)=>a+r.revenue,0);
  const merged = rows.filter(r=>r.merged);

  return `${coverageWarning(s, w)}${w?windowBar(w):`<div class="card" style="margin-top:0"><div class="note">This shopify.json predates daily store rows. Re-run <b>Pull Shopify</b> for date filtering.</div></div>`}
  <div class="grid">
    ${kpi("Retail-assist revenue", lakh(tot), `${rows.length} stores`)}
    ${kpi("Top store", esc(rows[0]?.store||"—"), inr(rows[0]?.revenue))}
    ${kpi("Names merged", num(merged.length), merged.length?"spelling variants":"none", merged.length?"var(--warn)":null)}
  </div>
  <div class="card"><h3>Stores by revenue<em>endless aisle only</em></h3>
  ${table(["Store","Revenue","Orders","AOV","Share"], rows.map(r=>[
    esc(r.store)+(r.merged?`<span class="pill">merged</span>`:"")+(r.matched==="unmatched"?`<span class="pill" style="color:var(--warn)">off roster</span>`:""),
    inr(r.revenue), num(r.orders), inr(r.revenue/r.orders),
    `${pct(tot?r.revenue/tot:0)}<div class="bar"><i style="width:${tot?100*r.revenue/tot:0}%"></i></div>`
  ]), "No retail-assist orders in this range.")}
  ${merged.length?`<div class="note">Merged from hand-typed variants: ${merged.map(m=>esc((m.variants||[]).join(" / "))).join(" · ")}. Fixing the note format at source would remove the need to guess.</div>`:""}
  <div class="note">This is not store sell-through. It is only what store staff booked through Shopify because an item was out of stock.</div></div>`;
},

products(){
  const s = state.shopify; if(!s) return missing("shopify");
  const grain = s.productDaily || [];
  const cats = s.categories || [];

  /* Fall back to the pre-aggregated list if an older shopify.json is
     still committed — filters need the grain, so say so rather than
     silently showing unfiltered numbers. */
  if(!grain.length){
    return `<div class="card"><div class="note err">
      This shopify.json predates product-level filtering. Re-run <b>Pull Shopify</b> to get date, channel and category filters.
    </div></div>` + views.productsLegacy();
  }

  const dates = [...new Set(grain.map(g=>g.date))].sort();
  const last = dates[dates.length-1];
  let from = dates[0];
  if(state.pDays!=="all"){
    const d = new Date(last+"T00:00:00Z");
    d.setUTCDate(d.getUTCDate()-(Number(state.pDays)-1));
    from = d.toISOString().slice(0,10);
  }

  const buckets = [...new Set(grain.map(g=>g.bucket))].sort();
  const rows = grain.filter(g =>
    g.date >= from && g.date <= last &&
    (state.pBucket==="all" || g.bucket===state.pBucket) &&
    (state.pCat==="all" || g.category===state.pCat));

  /* Roll the filtered grain back up per product. */
  const agg = new Map();
  for(const g of rows){
    const p = agg.get(g.title) || {title:g.title, category:g.category, units:0, revenue:0, digital:0};
    p.units += g.units; p.revenue += g.revenue;
    if(g.bucket==="online"||g.bucket==="app") p.digital += g.units;
    agg.set(g.title, p);
  }
  let list = [...agg.values()].map(p=>({...p, digitalShare: p.units ? p.digital/p.units : null}));
  list.sort((a,b) => state.pSort==="revenue" ? b.revenue-a.revenue
    : state.pSort==="digital" ? (a.digitalShare??1)-(b.digitalShare??1)
    : b.units-a.units);

  const tot = list.reduce((a,p)=>({units:a.units+p.units, revenue:a.revenue+p.revenue}),{units:0,revenue:0});
  const seg=(k,l,cur,attr)=>`<a data-${attr}="${k}" class="seg${cur===k?" on":""}">${esc(l)}</a>`;

  return `<div class="card" style="margin-top:0">
    <div class="segs">
      <span class="seglbl">Period</span>
      ${["all","7","3","1"].map(k=>seg(k,{all:"Full window","7":"7 days","3":"3 days","1":"Last day"}[k],state.pDays,"pdays")).join("")}
    </div>
    <div class="segs" style="margin-top:10px">
      <span class="seglbl">Channel</span>
      ${seg("all","All",state.pBucket,"pbucket")}
      ${buckets.map(b=>seg(b,b,state.pBucket,"pbucket")).join("")}
    </div>
    ${cats.length>1?`<div class="segs" style="margin-top:10px">
      <span class="seglbl">Category</span>
      ${seg("all","All",state.pCat,"pcat")}
      ${cats.map(c=>seg(c,c,state.pCat,"pcat")).join("")}
    </div>`:""}
    <div class="segs" style="margin-top:10px">
      <span class="seglbl">Sort</span>
      ${["units","revenue","digital"].map(k=>seg(k,{units:"Units",revenue:"Revenue",digital:"Least digital"}[k],state.pSort,"psort")).join("")}
    </div>
    <div style="font-size:11.5px;color:var(--dim);margin-top:12px">
      ${esc(from)} → ${esc(last)} · ${num(list.length)} products · ${num(tot.units)} units · ${inr(tot.revenue)}
    </div>
  </div>

  <div class="card"><h3>Products<em>${state.pBucket==="all"?"all channels":esc(state.pBucket)}${state.pCat==="all"?"":" · "+esc(state.pCat)}</em></h3>
  ${table(["Product","Category","Units","Revenue","Digital units","Digital share"], list.slice(0,150).map(p=>[
    esc(p.title), esc(p.category||"—"), num(p.units), inr(p.revenue), num(p.digital),
    p.digitalShare==null?"—":`<span style="color:${p.digitalShare<0.35?"var(--warn)":"var(--muted)"}">${pct(p.digitalShare)}</span>`
  ]), "Nothing matches these filters.")}
  ${list.length>150?`<div class="note">Showing the first 150 of ${num(list.length)}. Narrow the filters to see the rest.</div>`:""}
  <div class="note">Digital share is online plus app units. Anything under 35% is driven by stylists or store staff — that is the Zuri trap, and sorting by <b>Least digital</b> surfaces it.</div>
  </div>`;
},

google(){
  const g = state.google; if(!g) return missing("google");
  const live = (g.accounts||[]).filter(a=>a.ok && a.totals);
  const p = live.find(a=>a.id==="3669746941") || live[0];
  if(!p) return `<div class="card"><div class="empty">No account returned data.</div></div>`;

  const allDaily = g.daily||[];
  const dailyAll = allDaily.filter(d=>d.account===p.id);
  /* Window spans every account so the picker bounds do not shift when
     one regional account has a shorter history. */
  const w = allDaily.length ? windowFrom(allDaily.map(d=>d.date)) : null;
  let t = p.totals, webRows = p.web||[], omniRows = p.omni||[];
  let typeRows = p.types||[];
  let acctRows = (g.accounts||[]).map(a=>({name:a.name, ok:a.ok, totals:a.totals}));
  let creativeRows = (g.creatives?.rows)||[];

  if(w){
    const inWin = (r)=> r.date >= w.from && r.date <= w.to;

    /* By campaign type, recomputed inside the window. */
    const tMap = new Map();
    for(const r of dailyAll.filter(inWin)){
      const k = r.type || "Other";
      const o = tMap.get(k) || {type:k, spend:0, revenue:0, conversions:0, clicks:0, impressions:0, names:new Set(), omni:r.omni};
      o.spend+=r.spend; o.revenue+=r.revenue; o.conversions+=r.conversions;
      o.clicks+=r.clicks; o.impressions+=r.impressions; o.names.add(r.name);
      tMap.set(k,o);
    }
    typeRows = [...tMap.values()].map(o=>({
      type:o.type, spend:o.spend, campaigns:o.names.size,
      roas: o.omni ? null : (o.spend ? o.revenue/o.spend : null),
      ctr: o.impressions ? (100*o.clicks)/o.impressions : null,
      cpc: o.clicks ? o.spend/o.clicks : null,
      creativeLayer: o.type==="Search"||o.type==="Display"||o.type==="Demand Gen",
    })).sort((a,b)=>b.spend-a.spend);

    /* All accounts, same window. */
    const aMap = new Map();
    for(const r of allDaily.filter(inWin)){
      const o = aMap.get(r.account) || {spend:0, revenue:0, omniSpend:0};
      if(r.omni) o.omniSpend += r.spend; else { o.spend += r.spend; o.revenue += r.revenue; }
      aMap.set(r.account,o);
    }
    acctRows = (g.accounts||[]).map(a=>{
      const o = aMap.get(a.id);
      const tot = o ? o.spend+o.omniSpend : 0;
      return {name:a.name, ok:a.ok,
        totals: o ? {webSpend:o.spend, webRoas:o.spend?o.revenue/o.spend:null, omniShare: tot?o.omniSpend/tot:0} : null};
    });

    /* Creatives only carry a date on newer pulls. */
    if(creativeRows.length && creativeRows[0].date != null){
      const cMap = new Map();
      for(const r of creativeRows.filter(inWin)){
        const k = r.adId || r.headline;
        const o = cMap.get(k) || {adId:r.adId, headline:r.headline, campaign:r.campaign, spend:0, revenue:0, clicks:0, impressions:0};
        o.spend+=r.spend; o.revenue+=r.revenue; o.clicks+=r.clicks; o.impressions+=r.impressions;
        cMap.set(k,o);
      }
      creativeRows = [...cMap.values()].map(c=>({...c, roas:c.spend?c.revenue/c.spend:null}))
        .sort((a,b)=>b.spend-a.spend);
    }

    const rows = rollup(dailyAll, w, r=>r.name, ["spend","revenue","conversions","clicks","impressions"]);
    const web = rows.filter(r=>!r._row.omni), om = rows.filter(r=>r._row.omni);
    const ws = web.reduce((a,r)=>a+r.spend,0), wv = web.reduce((a,r)=>a+r.revenue,0);
    const os = om.reduce((a,r)=>a+r.spend,0), ov = om.reduce((a,r)=>a+r.conversions,0);
    t = {webSpend:ws, webRevenue:wv, webRoas:ws?wv/ws:null, omniSpend:os, omniVisits:ov,
         omniCostPerVisit:ov?os/ov:null, omniShare:(ws+os)?os/(ws+os):0,
         naiveBlendedRoas:(ws+os)?(wv+ov)/(ws+os):null};
    webRows = web.map(r=>({name:r.key, type:r._row.type, spend:r.spend, revenue:r.revenue, roas:r.spend?r.revenue/r.spend:null}))
      .sort((a,b)=>b.spend-a.spend);
    omniRows = om.map(r=>({name:r.key, spend:r.spend, conversions:r.conversions, costPerVisit:r.conversions?r.spend/r.conversions:null}))
      .sort((a,b)=>b.spend-a.spend);
  }

  return `${coverageWarning(g, w)}${w?windowBar(w):`<div class="card" style="margin-top:0"><div class="note">This google.json predates daily rows. Re-run <b>Pull Google Ads</b> for date filtering.</div></div>`}
  <div class="grid">
    ${kpi("Web spend", lakh(t.webSpend), esc(p.name))}
    ${kpi("Web revenue", lakh(t.webRevenue), "Google attributed")}
    ${kpi("Web ROAS", xx(t.webRoas), "OMNI excluded", "var(--ok)")}
    ${kpi("OMNI spend", lakh(t.omniSpend), num(t.omniVisits)+" store visits", "var(--warn)")}
    ${kpi("OMNI share", pct(t.omniShare), "of total spend", t.omniShare>0.3?"var(--warn)":null)}
    ${kpi("Cost per visit", inr(t.omniCostPerVisit), "store visit campaigns")}
  </div>
  ${typeRows.length?`<div class="card"><h3>By campaign type<em>${w?`${esc(w.from)} → ${esc(w.to)}`:"where the money goes"}</em></h3>
    ${table(["Type","Spend","Campaigns","ROAS","CTR","CPC","Creative layer"], typeRows.map(ty=>[
      esc(ty.type), inr(ty.spend), num(ty.campaigns),
      ty.roas==null?`<span style="color:var(--dim)">not graded</span>`:`<span style="color:${ty.roas>=3?"var(--ok)":ty.roas>=1?"var(--muted)":"var(--err)"}">${xx(ty.roas)}</span>`,
      ty.ctr==null?"—":ty.ctr.toFixed(2)+"%", inr(ty.cpc),
      ty.creativeLayer?`<span style="color:var(--ok)">yes</span>`:`<span style="color:var(--dim)">none</span>`]))}
    <div class="note">Shopping renders from the product feed and Performance Max exposes asset groups rather than ads, so neither has creatives to inspect. OMNI buys store visits and is never graded on ROAS.</div>
    ${g.includesToday?`<div class="note">Today is included and <b>provisional</b> — Google keeps attributing conversions for hours, so today's ROAS will revise upward.</div>`:""}
  </div>`:""}

  <div class="card"><h3>Web campaigns<em>graded on ROAS</em></h3>
  ${(()=>{
    const types = [...new Set(webRows.map(c=>c.type).filter(Boolean))];
    const seg=(k,l)=>`<a data-gtype="${esc(k)}" class="seg${state.gType===k?" on":""}">${esc(l)}</a>`;
    const rows = webRows.filter(c=>state.gType==="all" || c.type===state.gType);
    return (types.length>1?`<div class="segs" style="margin-bottom:14px">
      <span class="seglbl">Type</span>${seg("all","All")}${types.map(t=>seg(t,t)).join("")}
    </div>`:"") +
    table(["Campaign","Type","Spend","Revenue","ROAS"], rows.map(c=>[
      esc(c.name), esc(c.type||"—"), inr(c.spend), inr(c.revenue),
      `<span style="color:${c.roas>=3?"var(--ok)":c.roas>=1?"var(--muted)":"var(--err)"}">${xx(c.roas)}</span>`]),
      "No campaigns of this type.");
  })()}</div>

  ${(()=>{
    const cr = g.creatives;
    if(!cr) return "";
    if(!cr.available) return `<div class="card"><h3>Creatives<em>unavailable</em></h3>
      <div class="note err">Could not fetch ad-level data — ${esc(cr.error||"unknown")}</div>
      <div class="note">${esc(cr.note)}</div></div>`;
    if(!creativeRows.length) return `<div class="card"><h3>Creatives<em>none in this range</em></h3>
      <div class="note">${esc(cr.note)}</div></div>`;
    const dated = cr.rows?.[0]?.date != null;
    return `<div class="card"><h3>Creatives<em>${dated && w?`${esc(w.from)} → ${esc(w.to)}`:"Search, Display and Demand Gen only"}</em></h3>
      ${table(["Headline","Campaign","Spend","Clicks","CTR","Revenue","ROAS"], creativeRows.slice(0,60).map(a=>[
        esc(a.headline||a.adId||"—"), esc(a.campaign), inr(a.spend), num(a.clicks),
        a.impressions?((100*a.clicks)/a.impressions).toFixed(2)+"%":"—",
        inr(a.revenue),
        `<span style="color:${a.roas>=3?"var(--ok)":a.roas>=1?"var(--muted)":"var(--err)"}">${xx(a.roas)}</span>`]))}
      <div class="note">${esc(cr.note)}</div>
      ${dated?"":`<div class="note">This google.json predates dated creatives, so these figures cover the whole pull rather than the selected range. Re-run <b>Pull Google Ads</b> to fix.</div>`}</div>`;
  })()}

  <div class="card"><h3>All accounts</h3>
  ${table(["Account","Status","Web spend","Web ROAS","OMNI share"], acctRows.map(a=>[
    esc(a.name), a.ok?"ok":`<span style="color:var(--err)">failed</span>`,
    a.totals?inr(a.totals.webSpend):"—", a.totals?xx(a.totals.webRoas):"—", a.totals?pct(a.totals.omniShare):"—"]))}</div>`;
},

meta(){
  const m = state.meta;
  if(!m) return missing("meta");
  const dailyAll = m.rows||[];
  const w = dailyAll.length ? windowFrom(dailyAll.map(d=>d.date)) : null;
  let t = m.totals, camps = m.campaigns||[];

  if(w){
    const rows = rollup(dailyAll.filter(r=>!/store_visits|store traffic/i.test(`${r.objective||""} ${r.name||""}`)),
      w, r=>r.name, ["spend","webRevenue","omniRevenue","impressions","clicks","webPurchases","addToCart","checkouts"]);
    const S=k=>rows.reduce((a,r)=>a+r[k],0);
    const spend=S("spend"), wr=S("webRevenue"), orv=S("omniRevenue"), imp=S("impressions"), clk=S("clicks");
    t = {spend, webRevenue:wr, omniRevenue:orv, webRoas:spend?wr/spend:null, omniRoas:spend?orv/spend:null,
      omniInflation:wr?(orv-wr)/wr:null, webPurchases:S("webPurchases"), addToCart:S("addToCart"),
      checkouts:S("checkouts"), impressions:imp, clicks:clk,
      cpm:imp?(spend/imp)*1000:null, ctr:imp?(100*clk)/imp:null, cpc:clk?spend/clk:null,
      cpa:S("webPurchases")?spend/S("webPurchases"):null,
      cartToCheckout:S("addToCart")?S("checkouts")/S("addToCart"):null,
      checkoutToPurchase:S("checkouts")?S("webPurchases")/S("checkouts"):null,
      storeVisitSpend:(m.totals||{}).storeVisitSpend};
    camps = rows.map(r=>({name:r.key, spend:r.spend, webRevenue:r.webRevenue, omniRevenue:r.omniRevenue,
      impressions:r.impressions, clicks:r.clicks,
      webRoas:r.spend?r.webRevenue/r.spend:null, omniRoas:r.spend?r.omniRevenue/r.spend:null,
      cpm:r.impressions?(r.spend/r.impressions)*1000:null,
      ctr:r.impressions?(100*r.clicks)/r.impressions:null,
      cpc:r.clicks?r.spend/r.clicks:null,
      cpa:r.webPurchases?r.spend/r.webPurchases:null})).sort((a,b)=>b.spend-a.spend);
  }
  const inflate = t.omniInflation;
  return `${w?windowBar(w):""}
  <div class="grid">
    ${kpi("Spend", lakh(t.spend), esc(m.range||""))}
    ${kpi("Website revenue", lakh(t.webRevenue), "7-day click, pixel", "var(--cyan)")}
    ${kpi("Website ROAS", xx(t.webRoas), "the report figure", "var(--ok)")}
    ${kpi("Omni ROAS", xx(t.omniRoas), inflate!=null?`${(100*inflate).toFixed(0)}% above web`:"all surfaces", "var(--warn)")}
    ${kpi("Purchases", num(t.webPurchases), "website pixel")}
    ${t.storeVisitSpend?kpi("Store-visit spend", lakh(t.storeVisitSpend), "excluded from ROAS", "var(--violet)"):""}
  </div>
  <div class="card"><h3>Delivery<em>derived from summed impressions and clicks</em></h3>
    <div class="grid">
      ${kpi("Impressions", num(t.impressions), num(t.clicks)+" clicks")}
      ${kpi("CPM", inr(t.cpm), "per 1,000 impressions")}
      ${kpi("CTR", t.ctr==null?"—":t.ctr.toFixed(2)+"%", "clicks ÷ impressions")}
      ${kpi("CPC", inr(t.cpc), "per click")}
      ${kpi("CPA", inr(t.cpa), "per website purchase", t.cpa>4000?"var(--warn)":null)}
    </div>
    <div class="note">These come from totalled impressions and clicks, not an average of the daily rates — averaging would weight a quiet day the same as a heavy one.</div>
    ${m.includesToday?`<div class="note">Today is included and <b>provisional</b> — Meta attributes conversions for hours after the click, so today's revenue and ROAS will revise upward.</div>`:""}
  </div>
  <div class="card"><h3>Funnel<em>Meta pixel events</em></h3>
    ${table(["Step","Count","Rate"],[
      ["Add to cart", num(t.addToCart), "—"],
      ["Reached checkout", num(t.checkouts), rate(t.cartToCheckout)],
      ["Purchased", num(t.webPurchases), rate(t.checkoutToPurchase)],
    ])}
  </div>
  <div class="card"><h3>Campaigns<em>website vs omni side by side</em></h3>
    ${table(["Campaign","Spend","CPM","CTR","CPC","CPA","Web revenue","Web ROAS","Omni ROAS"], camps.map(c=>[
      esc(c.name), inr(c.spend), inr(c.cpm),
      c.ctr==null?"—":`<span style="color:${c.ctr<0.5?"var(--warn)":"var(--muted)"}">${c.ctr.toFixed(2)}%</span>`,
      inr(c.cpc), inr(c.cpa), inr(c.webRevenue),
      `<span style="color:${c.webRoas>=3?"var(--ok)":c.webRoas>=1?"var(--muted)":"var(--err)"}">${xx(c.webRoas)}</span>`,
      `<span style="color:var(--warn)">${xx(c.omniRoas)}</span>`]))}
    <div class="note">Website revenue is <b>7-day-click pixel purchases</b> requested explicitly. Omni folds in app, offline and store and reads materially higher — it is shown only so the gap is visible.</div>
    ${m.unverified?`<div class="note err">${esc(m.unverified)}</div>`:""}
  </div>`;
},

funnels(){
  const a = state.ga4app, w = state.ga4web;
  if(!a && !w) return missing("ga4-web");
  const allDates = [...(w?.daily||[]), ...(a?.daily||[])].map(x=>x.date);
  const win = allDates.length ? windowFrom(allDates) : null;
  const scope = (d) => {
    if(!win || !d?.daily?.length) return d?.totals;
    const days = d.daily.filter(x=>x.date>=win.from && x.date<=win.to);
    const S=k=>days.reduce((acc,x)=>acc+(Number(x[k])||0),0);
    const s0=S("sessions");
    return {sessions:s0, users:S("users"), addToCarts:S("addToCarts"), checkouts:S("checkouts"),
      purchases:S("purchases"), revenue:S("revenue"),
      conversionRate:s0?S("purchases")/s0:null, cartRate:s0?S("addToCarts")/s0:null,
      cartToCheckout:S("addToCarts")?S("checkouts")/S("addToCarts"):null,
      checkoutToPurchase:S("checkouts")?S("purchases")/S("checkouts"):null,
      aov:S("purchases")?S("revenue")/S("purchases"):null};
  };
  const row = (d,label) => d ? {label, t:scope(d), trend:d.trend, range:win?`${win.from} → ${win.to}`:d.range} : null;
  const both = [row(w,"Web"), row(a,"App")].filter(Boolean);
  return `${win?windowBar(win,"applies to both surfaces"):""}
  <div class="card"><h3>Where each surface loses people<em>GA4</em></h3>
    ${table(["Surface","Sessions","Add to cart","Cart → checkout","Checkout → purchase","Conversion","AOV"],
      both.map(b=>[
        esc(b.label), num(b.t.sessions),
        `<span style="color:${b.t.cartRate<0.05?"var(--err)":"var(--muted)"}">${rate(b.t.cartRate)}</span>`,
        `<span style="color:${b.t.cartToCheckout<0.15?"var(--err)":"var(--muted)"}">${rate(b.t.cartToCheckout)}</span>`,
        rate(b.t.checkoutToPurchase),
        `<span style="color:var(--cyan)">${rate(b.t.conversionRate)}</span>`,
        inr(b.t.aov)]))}
    <div class="note">Red marks the step where that surface loses most people. Web and app fail at different points, so a single blended funnel would hide both.</div>
  </div>
  ${both.map(b=>`<div class="card"><h3>${esc(b.label)}<em>${esc(b.range||"")}</em></h3>
    <div class="grid">
      ${kpi("Sessions", num(b.t.sessions), num(b.t.users)+" users")}
      ${kpi("Purchases", num(b.t.purchases), inr(b.t.revenue)+" revenue")}
      ${kpi("Conversion", rate(b.t.conversionRate), "purchases ÷ sessions", "var(--cyan)")}
      ${kpi("AOV", inr(b.t.aov), b.t.aov && b.t.aov < 1000 ? "⚠ implausible — check tracking" : "", b.t.aov && b.t.aov < 1000 ? "var(--err)" : null)}
      ${b.trend?kpi("Trend", (b.trend.conversionChange>=0?"+":"")+Math.round(100*b.trend.conversionChange)+"%",
        `${rate(b.trend.firstHalf.conversionRate)} → ${rate(b.trend.secondHalf.conversionRate)}`,
        b.trend.conversionChange>=0?"var(--ok)":"var(--err)"):""}
    </div>
    ${(()=>{const d = b.label==="Web"?w:a; return table(["Channel","Sessions","Conversion"],
      (d.channels||[]).slice(0,8).map(c=>[esc(c.channel), num(c.sessions),
        `<span style="color:${c.conversionRate<0.001?"var(--err)":"var(--muted)"}">${rate(c.conversionRate)}</span>`]));})()}
  </div>`).join("")}`;
},

quality(){
  const s = state.shopify, g = state.google;
  const u = s?.unclassified||[];
  const rows = [];
  if(s) rows.push(["Shopify", s.fetchedAt?ago(s.fetchedAt):"—", esc(s.range||"—"), s.truncated?`<span style="color:var(--err)">truncated</span>`:"complete"]);
  if(g) rows.push(["Google Ads", g.fetchedAt?ago(g.fetchedAt):"—", esc(g.range||"—"), "complete"]);

  if(state.eretail) rows.push(["eRetail", "from Excel", "2020-02-08 → 2026-07-31", "list value only"]);
  return `<div class="card"><h3>Sources</h3>

  <div class="card"><h3>Unclassified drafts<em>${u.length} orders</em></h3>
  ${table(["Order","Value","Note"], u.map(x=>[esc(x.name), inr(x.amount), esc(x.note||"—")]),"Every draft matched a rule.")}
  <div class="note">These matched no rule and were left unassigned rather than guessed into a bucket. A growing list means the note conventions are drifting.</div></div>
  <div class="card"><h3>What is still missing</h3>
  ${table(["Source","Covers","Status"],[
    ["eRetail API","Daily auto-append instead of yearly Excel","Key held, endpoint not wired"],
    ["Shopify / Google daily rows","Filtering and comparison on those two sources","Still one pre-aggregated window"],

/* ---------- shared date window ---------- */
/* One control, reused by any view whose source carries daily rows.
   Views without daily data say so rather than showing a picker that
   silently does nothing. */
const WINDOWS = [["all","All"],["30","30d"],["14","14d"],["7","7d"],["1","Yesterday"]];

/* An explicit from/to beats a fixed preset once someone wants "the
   Rakhi fortnight" or "the same week last year". Presets stay as
   one-click shortcuts and simply write into the same two dates. */
function windowFrom(dates){
  const sorted = [...new Set(dates)].filter(Boolean).sort();
  if(!sorted.length) return null;
  const first = sorted[0], last = sorted[sorted.length-1];

  let from = state.from, to = state.to;
  if(!from || !to){
    to = last;
    if(state.win==="all") from = first;
    else {
      const d = new Date(last+"T00:00:00Z");
      d.setUTCDate(d.getUTCDate()-(Number(state.win)-1));
      from = d.toISOString().slice(0,10);
    }
  }
  /* Keep the chosen range inside what the data actually covers. */
  if(from < first) from = first;
  if(to > last) to = last;
  if(from > to) from = to;
  return {from, to, first, last, days: sorted.filter(x=>x>=from && x<=to).length};
}

/* A pull that stops short of its own stated range is the failure mode
   that looks like success. Say it on the view, not just in the log. */
function coverageWarning(src, w){
  if(!src?.range || !w?.last) return "";
  const m = /(\d{4}-\d{2}-\d{2})\s*→\s*(\d{4}-\d{2}-\d{2})/.exec(src.range);
  if(!m) return "";
  const [,reqFrom,reqTo] = m;
  const short = w.last < reqTo;
  const late  = w.first > reqFrom;
  if(!short && !late && !src.truncated) return "";
  return `<div class="card" style="margin-top:0"><div class="note err">
    <b>Incomplete data.</b> The pull asked for ${esc(reqFrom)} → ${esc(reqTo)} but the file only covers
    ${esc(w.first)} → ${esc(w.last)}${src.truncated?" and is flagged truncated":""}.
    Everything below is limited to what actually arrived. Re-run the pull.
  </div></div>`;
}

function windowBar(w, note){
  const seg=([k,l])=>`<a data-win="${k}" class="seg${(!state.from && state.win===k)?" on":""}">${esc(l)}</a>`;
  return `<div class="card" style="margin-top:0">
    <div class="segs">
      <span class="seglbl">Dates</span>
      <input type="date" data-from value="${esc(w?.from||"")}" min="${esc(w?.first||"")}" max="${esc(w?.last||"")}" class="dateinput">
      <span style="color:var(--dim);font-size:12px">to</span>
      <input type="date" data-to value="${esc(w?.to||"")}" min="${esc(w?.first||"")}" max="${esc(w?.last||"")}" class="dateinput">
      <span class="seglbl" style="margin-left:10px">Quick</span>
      ${WINDOWS.map(seg).join("")}
      ${state.from?`<a data-win="all" class="seg">Clear</a>`:""}
    </div>
    <div style="font-size:11.5px;color:var(--dim);margin-top:10px">
      ${w?`${w.days} day${w.days===1?"":"s"} selected · data available ${esc(w.first)} → ${esc(w.last)}`:"no daily data"}${note?` · ${esc(note)}`:""}
    </div>
  </div>`;
}

/* Sum any daily rows inside the window, grouped by a key. */
function rollup(rows, w, keyFn, fields){
  const out = new Map();
  for(const r of rows||[]){
    if(!r.date || r.date < w.from || r.date > w.to) continue;
    const k = keyFn(r);
    const o = out.get(k) || {key:k, ...Object.fromEntries(fields.map(f=>[f,0])), _row:r};
    for(const f of fields) o[f] += Number(r[f])||0;
    out.set(k,o);
  }
  return [...out.values()];
}

/* ---------- date range helpers ---------- */
const iso = d => d.toISOString().slice(0,10);
function rangeFor(key, rows){
  const last = rows.length ? rows[rows.length-1].date : iso(new Date());
  const end = new Date(last+"T00:00:00Z");
  const start = new Date(end);
  if(key==="7d") start.setUTCDate(end.getUTCDate()-6);
  else if(key==="30d") start.setUTCDate(end.getUTCDate()-29);
  else if(key==="90d") start.setUTCDate(end.getUTCDate()-89);
  /* A month-arithmetic 12m gives 11 months when the end date is a
     31st (31 Jul minus 11 months is 31 Aug). Use a true 365 days. */
  else if(key==="12m") start.setUTCDate(end.getUTCDate()-364);
  else if(key==="ytd") return {from:end.getUTCFullYear()+"-01-01", to:last};
  else if(key==="all") return {from:rows.length?rows[0].date:last, to:last};
  return {from:iso(start), to:last};
}
function shift(r, key){
  const f=new Date(r.from+"T00:00:00Z"), t=new Date(r.to+"T00:00:00Z");
  if(key==="prev_year"){ f.setUTCFullYear(f.getUTCFullYear()-1); t.setUTCFullYear(t.getUTCFullYear()-1); }
  else if(key==="prev_period"){
    const days = Math.round((t-f)/86400000)+1;
    t.setUTCDate(f.getUTCDate()-1); f.setUTCDate(f.getUTCDate()-days);
  } else return null;
  return {from:iso(f), to:iso(t)};
}
function agg(rows, r, channel){
  const out = {units:0, value:0, orders:0, byDate:{}, byChannel:{}};
  if(!r) return out;
  for(const x of rows){
    if(x.date < r.from || x.date > r.to) continue;
    if(channel!=="all" && x.channel!==channel) continue;
    out.units+=x.units; out.value+=x.listValue; out.orders+=x.orders;
    out.byDate[x.date]=(out.byDate[x.date]||0)+x.listValue;
    const c=out.byChannel[x.channel]||(out.byChannel[x.channel]={units:0,value:0});
    c.units+=x.units; c.value+=x.listValue;
  }
  return out;
}
function delta(now, before){
  if(!before || !before.value) return null;
  return (now.value-before.value)/before.value;
}
const dpill = d => d==null ? "" :
  `<span style="color:${d>=0?"var(--ok)":"var(--err)"}">${d>=0?"▲":"▼"} ${Math.abs(d*100).toFixed(1)}%</span>`;

/* Monthly line chart, two series. */
function chart(a, b, labelA, labelB){
  const months = m => { const o={}; for(const [d,v] of Object.entries(m)) o[d.slice(0,7)]=(o[d.slice(0,7)]||0)+v; return o; };
  const A = months(a.byDate), B = b?months(b.byDate):{};
  const ka = Object.keys(A).sort(), kb = Object.keys(B).sort();
  if(ka.length<2) return `<div class="empty">Not enough months in this range to plot.</div>`;
  const W=900,H=220,P=34;
  const max = Math.max(...ka.map(k=>A[k]), ...kb.map(k=>B[k]||0), 1);
  const line = (keys,obj)=>keys.map((k,i)=>{
    const x=P+(i/(Math.max(keys.length-1,1)))*(W-P*2);
    const y=H-P-((obj[k]||0)/max)*(H-P*2);
    return `${i?"L":"M"}${x.toFixed(1)},${y.toFixed(1)}`;}).join(" ");
  const pa=line(ka,A), pb=kb.length>1?line(kb.slice(0,ka.length),B):null;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <path d="${pa} L${W-P},${H-P} L${P},${H-P} Z" fill="var(--cyan)" opacity=".08"/>
    ${pb?`<path d="${pb}" fill="none" stroke="var(--violet)" stroke-width="1.6" stroke-dasharray="4 3" opacity=".85"/>`:""}
    <path d="${pa}" fill="none" stroke="var(--cyan)" stroke-width="2"/>
    <text x="${P}" y="${H-10}" fill="var(--dim)" font-size="11" font-family="var(--mono)">${ka[0]}</text>
    <text x="${W-P}" y="${H-10}" fill="var(--dim)" font-size="11" font-family="var(--mono)" text-anchor="end">${ka[ka.length-1]}</text>
    <text x="${P}" y="18" fill="var(--cyan)" font-size="11">${esc(labelA)}</text>
    ${pb?`<text x="${P+120}" y="18" fill="var(--violet)" font-size="11">${esc(labelB)} (dashed)</text>`:""}
  </svg>`;
}

function bucketRows(s){
  const tot = s.totals.revenue;
  const colour = b => b.startsWith("online")||b==="app" ? "var(--cyan)"
    : b==="stylist"||b==="retail_assist" ? "var(--violet)"
    : b==="gift" ? "var(--warn)" : b.includes("_to_draft")||b==="draft_unclassified" ? "var(--warn)" : "var(--muted)";
  return table(["Bucket","Revenue","Orders","AOV","Share"], (s.buckets||[]).map(b=>[
    `<span style="color:${colour(b.bucket)}">${esc(b.bucket)}</span>`,
    inr(b.revenue), num(b.orders), inr(b.aov),
    `${pct(b.share)}<div class="bar"><i style="width:${100*b.share}%"></i></div>`
  ]));
}

const missing = n => `<div class="card"><div class="empty">
  <b>data/${n}.json has not been published yet.</b><br>
  Run the “Pull ${n==="google"?"Google Ads":"Shopify"}” workflow in the Actions tab, then reload this page.
</div></div>`;

function render(){
  $("#title").textContent = state.view==="google" ? "Google Ads" : state.view==="quality" ? "Data quality" : state.view==="history" ? "Retail history" : state.view==="meta" ? "Meta Ads" : state.view;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on", a.dataset.v===state.view));
  $("#view").innerHTML = views[state.view] ? views[state.view]() : "";
  window.scrollTo(0,0);
}

document.querySelectorAll("nav a").forEach(a=>a.addEventListener("click",()=>{
  state.view=a.dataset.v; location.hash=a.dataset.v; render();
}));
/* range / comparison / channel controls */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-range],[data-cmp],[data-chan],[data-pbucket],[data-pcat],[data-pdays],[data-psort],[data-gtype],[data-win]");
  if(!el) return;
  if(el.dataset.range) state.range = el.dataset.range;
  if(el.dataset.cmp) state.cmp = el.dataset.cmp;
  if(el.dataset.chan) state.channel = el.dataset.chan;
  if(el.dataset.pbucket) state.pBucket = el.dataset.pbucket;
  if(el.dataset.pcat) state.pCat = el.dataset.pcat;
  if(el.dataset.pdays) state.pDays = el.dataset.pdays;
  if(el.dataset.psort) state.pSort = el.dataset.psort;
  if(el.dataset.gtype) state.gType = el.dataset.gtype;
  if(el.dataset.win){ state.win = el.dataset.win; state.from = null; state.to = null; }
  render();
});

document.addEventListener("change", e=>{
  const el = e.target;
  if(!el.matches?.("[data-from],[data-to]")) return;
  if(el.hasAttribute("data-from")) state.from = el.value || null;
  else state.to = el.value || null;
  /* One end set on its own still needs the other, so fall back to the
     edge of the available data rather than rendering an empty range. */
  if(state.from && !state.to) state.to = el.max || state.from;
  if(state.to && !state.from) state.from = el.min || state.to;
  render();
});

window.addEventListener("hashchange",()=>{
  const v=location.hash.slice(1); if(views[v]){ state.view=v; render(); }
});

async function loadEretail(){
  try{
    const r = await fetch("./data/eretail/history.jsonl?t="+Date.now());
    if(!r.ok) throw new Error(r.status+" "+r.statusText);
    const txt = await r.text();
    return txt.trim().split("\n").filter(Boolean).map(l=>JSON.parse(l));
  }catch(e){ state.errors.push("eretail/history.jsonl — "+e.message); return null; }
}

/* The browser holds no API keys, so this cannot call Shopify or Meta.
   It re-reads the committed JSON, which is how a scheduled pull reaches
   the page. Labelled "Sync" rather than "Refresh data" so nobody expects
   it to hit the platforms directly. */
function setNote(msg, bad){
  const el = $("#syncnote");
  el.style.display = msg ? "inline-block" : "none";
  el.style.color = bad ? "var(--err)" : "var(--muted)";
  el.textContent = msg || "";
}

/* Scheduled pulls keep this current on their own — Shopify hourly, ads
   and analytics at eight fixed times a day. The button exists for the
   gap between slots, not because anyone has to press it. */
let lastSync = 0;

async function syncNow(){
  const btn = $("#sync");
  if(!SYNC_TOKEN){
    setNote("No token configured — this only re-reads published files.");
    return reload(false);
  }
  /* One run at a time. The workflow also cancels queued runs, so a
     burst of clicks cannot become a burst of pulls. */
  if(Date.now() - lastSync < 90000){
    setNote("A sync just started — give it a moment.");
    return;
  }
  lastSync = Date.now();

  const before = state.shopify?.fetchedAt || "";
  btn.textContent = "Starting…"; btn.style.opacity = ".6";
  setNote("Pulling fresh data…");
  try{
    const r = await fetch(`https://api.github.com/repos/${SYNC_REPO}/actions/workflows/sync.yml/dispatches`, {
      method:"POST",
      headers:{ Authorization:`Bearer ${SYNC_TOKEN}`, Accept:"application/vnd.github+json", "Content-Type":"application/json" },
      body: JSON.stringify({ ref:"main", inputs:{ days:String(SYNC_DAYS) } }),
    });
    if(r.status !== 204){
      const detail = await r.text();
      /* Name the likely cause instead of leaving a bare status code. */
      const hint = r.status===401 ? "the token is invalid or expired"
                 : r.status===403 ? "the token lacks Actions write on this repo"
                 : r.status===404 ? "check SYNC_REPO and that sync.yml is on main"
                 : detail.slice(0,120);
      throw new Error(`${r.status} — ${hint}`);
    }
  }catch(e){
    lastSync = 0;
    btn.textContent="Sync"; btn.style.opacity="1";
    setNote(`Could not start — ${e.message||e}`, true);
    return;
  }
  /* The run takes a couple of minutes; poll until the files change. */
  const started = Date.now();
  const tick = async () => {
    await reload(true);
    if((state.shopify?.fetchedAt||"") !== before){
      btn.textContent="Sync"; btn.style.opacity="1";
      setNote("Up to date.");
      setTimeout(()=>setNote(""), 5000);
      return;
    }
    const mins = (Date.now()-started)/60000;
    if(mins > 12){
      btn.textContent="Sync"; btn.style.opacity="1";
      setNote("Taking longer than usual — check the Actions tab.", true);
      return;
    }
    btn.textContent = `Pulling… ${Math.max(1,Math.round(mins))}m`;
    setTimeout(tick, 12000);
  };
  setTimeout(tick, 25000);
}

async function reload(silent){
  const btn = $("#sync");
  if(btn && !silent && !SYNC_TOKEN){ btn.textContent = "Checking…"; btn.style.opacity = ".6"; }
  state.errors = [];
  const [sh,go,er,mt,ga,gw] = await Promise.all([
    load("shopify"), load("google"), loadEretail(),
    load("meta"), load("ga4-app"), load("ga4-web")]);
  if(sh) state.shopify=sh; if(go) state.google=go; if(er) state.eretail=er;
  if(mt) state.meta=mt; if(ga) state.ga4app=ga; if(gw) state.ga4web=gw;
  stamp();
  if(btn && !silent && !SYNC_TOKEN){ btn.textContent = "Sync"; btn.style.opacity = "1"; }
  render();
}

/* One overall timestamp hides a single stalled source, so each is
   tracked separately and the worst one drives the chip. */
function sourceAges(){
  return [
    ["Shopify", state.shopify?.fetchedAt, 80],
    /* Ads run at eight fixed times, so the longest daytime gap is three
       hours and the overnight gap is eight. Flag only a real stall. */
    ["Google", state.google?.fetchedAt, 260],
    ["Meta", state.meta?.fetchedAt, 260],
    ["GA4 web", state.ga4web?.fetchedAt, 260],
  ].filter(x=>x[1]).map(([name,at,limit])=>({
    name, at, mins:(Date.now()-new Date(at))/60000, limit,
  }));
}

function stamp(){
  const ages = sourceAges();
  const chip = $("#fresh");
  if(!ages.length){ chip.className="chip stale"; chip.querySelector("span").textContent="no data published"; return; }
  /* Each source has its own tolerance: Shopify runs every 30 minutes,
     the ad platforms hourly. */
  const late = ages.filter(a=>a.mins>a.limit);
  const shopify = ages.find(a=>a.name==="Shopify");
  chip.className = "chip"+(late.length?" stale":"");
  chip.title = ages.map(a=>`${a.name}: ${ago(a.at)}`).join("\n");
  chip.querySelector("span").textContent = late.length
    ? `${late.map(a=>a.name).join(", ")} behind`
    : (shopify ? `live · orders ${ago(shopify.at)}` : "updated "+ago(ages[0].at));
}

(async function init(){
  const [sh,go,er,mt,ga,gw] = await Promise.all([
    load("shopify"), load("google"), loadEretail(),
    load("meta"), load("ga4-app"), load("ga4-web")]);
  state.shopify=sh; state.google=go; state.eretail=er;
  state.meta=mt; state.ga4app=ga; state.ga4web=gw;

  stamp();
  $("#sync").addEventListener("click", syncNow);
  $("#sync").title = SYNC_TOKEN
    ? `Pull the last ${SYNC_DAYS} days now — takes about two minutes`
    : "Re-read published files (no token configured)";
  /* Poll often enough that a 30-minute Shopify job shows up without
     anyone thinking about it. */
  setInterval(()=>reload(true), 2*60*1000);
  /* Poll quietly so a scheduled pull appears without anyone reloading. */
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) reload(true); });
  const v = location.hash.slice(1);
  if(views[v]) state.view=v;
  render();
})();
</script>
