name: Pull Google Ads

on:
  schedule:
    # 07:00 and 19:00 IST (01:30 / 13:30 UTC). GitHub cron is UTC only.
    - cron: "30 1 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      range:
        description: "Supermetrics date_range_type"
        required: false
        default: "last_7_days"

# Needed so the job can commit the refreshed JSON back to the repo.
permissions:
  contents: write

concurrency:
  group: pull-google
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull Google Ads
        env:
          # Add under Settings → Secrets and variables → Actions.
          # Never inline the key here — Actions logs are readable by anyone
          # with repo access, and secrets are masked, literals are not.
          SUPERMETRICS_API_KEY: ${{ secrets.SUPERMETRICS_API_KEY }}
          RANGE: ${{ inputs.range || 'last_7_days' }}
        run: node scripts/pull-google.mjs

      - name: Commit if changed
        run: |
          git config user.name  "mulmulos-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "data: google ads $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
