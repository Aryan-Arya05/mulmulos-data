name: Live · Ads and analytics

# Google and Meta only. GA4 sits in its own job at four times a day:
# session data is the least time-critical thing here and it was the
# slowest step, so hourly it was the main cost driver.

on:
  schedule:
    # Nine slots IST: 6, 8, 11am, 1, 3, 5, 6:30, 8, 10pm.
    # (IST is UTC+5:30.) Two crons because 6:30pm IST falls on the hour
    # in UTC while every other slot falls on the half hour.
    #
    # Gaps run 2–3 hours in the morning and tighten to 90 minutes through
    # the evening peak. Ad platforms keep attributing conversions for
    # hours, so anything tighter would re-fetch unsettled numbers.
    - cron: "30 0,2,5,7,9,11,14,16 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-ads
  cancel-in-progress: true

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      # continue-on-error throughout: one platform being down must not
      # cost us the other three.
      - name: Google Ads
        continue-on-error: true
        env:
          SUPERMETRICS_API_KEY: ${{ secrets.SUPERMETRICS_API_KEY }}
          DAYS: "2"
          INCLUDE_TODAY: "1"
          SKIP_CREATIVES: "1"
        run: node scripts/pull-google.mjs

      - name: Meta Ads
        continue-on-error: true
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCOUNT_ID: "277407879800547"
          META_API_VERSION: ${{ vars.META_API_VERSION || 'v23.0' }}
          DAYS: "2"
          INCLUDE_TODAY: "1"
        run: node scripts/pull-meta.mjs

      # GA4 rides along here rather than in its own job — same schedule,
      # no extra runner time, and it keeps the allowance in budget.
      - name: GA4 web
        continue-on-error: true
        env:
          GA4_SERVICE_ACCOUNT: ${{ secrets.GA4_SERVICE_ACCOUNT }}
          GA4_PROPERTY_ID: "353202736"
          GA4_LABEL: "web"
          DAYS: "2"
          INCLUDE_TODAY: "1"
        run: node scripts/pull-ga4.mjs

      - name: Commit
        run: |
          git config user.name  "mulmulos-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add data/
          git diff --staged --quiet || git commit -m "live: ads $(TZ=Asia/Kolkata date +%H:%M) IST"
          git push || true
