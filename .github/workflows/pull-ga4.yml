name: Backfill · GA4 (app)

on:
  schedule:
    # 07:15 and 19:15 IST — last in the stagger, behind Google, Shopify and Meta.
    # 1st and 15th at 03:00 IST. These exist to backfill what the live jobs
    # skip — stylist timelines, creatives, full history — not to keep
    # the dashboard fresh. The live jobs do that.
    - cron: "30 21 1,15 * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to pull"
        required: false
        default: "90"

permissions:
  contents: write

concurrency:
  group: pull-ga4-app
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Backfill · GA4 (app)
        env:
          # The ENTIRE service-account JSON key file, pasted as one secret.
          GA4_SERVICE_ACCOUNT: ${{ secrets.GA4_SERVICE_ACCOUNT }}
          GA4_PROPERTY_ID: "469222398"   # mulmulappbrew — the app property
          GA4_LABEL: "app"
          DAYS: ${{ inputs.days || '90' }}
          INCLUDE_TODAY: "1"
        run: node scripts/pull-ga4.mjs

      - name: Commit if changed
        run: |
          git config user.name  "mulmulos-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add data/
          if git diff --staged --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "data: ga4 app $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
