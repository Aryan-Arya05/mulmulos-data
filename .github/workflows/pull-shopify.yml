name: Backfill · Shopify

on:
  schedule:
    # 07:05 and 19:05 IST — five minutes after Google, so the two
    # jobs never race each other for the same commit.
    # 1st and 15th at 03:00 IST. These exist to backfill what the live jobs
    # skip — stylist timelines, creatives, full history — not to keep
    # the dashboard fresh. The live jobs do that.
    - cron: "30 21 1,15 * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to pull"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: pull-shopify
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Backfill · Shopify
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP: shopmulmul.myshopify.com
          DAYS: ${{ inputs.days || '30' }}
          INCLUDE_TODAY: "1"
        run: node scripts/pull-shopify.mjs

      - name: Commit if changed
        run: |
          git config user.name  "mulmulos-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add data/
          if git diff --staged --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "data: shopify $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
